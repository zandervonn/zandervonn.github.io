<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b16">
    <meta name="robots" content="noindex">
    <title>Android access requested — Cosmic Clash</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <div class="shell header-inner">
            <a class="brand" href="/" aria-label="Cosmic Clash home">
                <span class="brand-orb" aria-hidden="true"></span>
                <span>Cosmic Clash</span>
            </a>
        </div>
    </header>
    <main class="request-confirmation" id="main">
        <div class="shell request-confirmation-inner">
            <p class="eyebrow">Android tester access</p>
            <h1>Request received.</h1>
            <p>I’ll add your Google Play email to the tester list and let you know when access is ready.</p>
            <div class="hero-actions">
                <a class="button button-primary" href="https://play.google.com/store/apps/details?id=com.AIvonn.TheCosmicClash">Open Google Play <span aria-hidden="true">↗</span></a>
                <a class="button button-secondary" href="/">Back to Cosmic Clash</a>
            </div>
        </div>
    </main>
</body>
</html>
